[package]
name = "wend-core"
description = "Core engine for wend: parse, index, search, recover, topology over Claude Code transcripts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rusqlite.workspace = true
etcetera.workspace = true
rayon.workspace = true
tracing.workspace = true

# Optional: local semantic search via fastembed (ONNX Runtime). Opt-in because
# it's heavy (model download, larger binary) and the keyword core needs none of it.
# ort gives ~5-10x the CPU throughput of a pure-Rust path — the speed that makes
# embedding the whole corpus practical.
fastembed = { version = "5", optional = true }

# Optional: remote embeddings via Azure OpenAI. `ureq` is blocking and brings no
# async runtime, which suits this entirely synchronous crate; both it and `regex`
# already resolve in the lockfile through fastembed, so enabling both features
# together pulls in no new crates. `regex` backs the outbound secret redaction.
ureq = { version = "3", features = ["json"], optional = true }
regex = { version = "1", optional = true }

[features]
semantic = ["dep:fastembed"]
azure = ["dep:ureq", "dep:regex"]

[dev-dependencies]
tempfile.workspace = true
